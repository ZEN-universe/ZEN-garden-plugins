[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "zen_garden_plugins"

[project]
name = "zen_garden_plugins"
version = "0.0.0"
description="zen_garden_plugins provides create plugins for zen garden."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name="Jan Wiegner"},
  { name="Christoph Funke", email="zen-garden@ethz.ch" },
  { name="Jacob Mannhardt"},
]
dependencies = [
    "zen_garden>=3.3.1"
]


[project.entry-points."zen_garden.plugins"]
plugin_template = "zen_garden_plugins.plugin_template.plugin"
plugin_template_add_new_constraint = "zen_garden_plugins.plugin_template_add_new_constraint.plugin"

[project.optional-dependencies]

docs = [
    "zen_garden[docs]>=3.3.1",
]

dev = [
    "zen_garden[dev]>=3.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 88
fix = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D400", "D415"] # add D in future
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["zen_garden_plugins"]

[tool.mypy]
#warn_unused_configs = true
#ignore_missing_imports = true
#check_untyped_defs = false
#disallow_untyped_defs = false
#exclude = []
